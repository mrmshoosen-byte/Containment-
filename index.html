<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Containment</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="left-sidebar">
        <h2>Node Map</h2>
        <div class="node-map"></div>
        <h3>Run Stats</h3>
        <div class="run-stats"></div>
    </div>
    <div class="main-content">
        <header>
            <h1>Containment</h1>
            <button id="end-turn">END TURN</button>
        </header>
        <div class="reward-progress">
            <div class="progress-bar"></div>
        </div>
        <div class="hexagon-frames">
            <div class="geometric-core">
                <!-- Geometric core SVG goes here -->
            </div>
            <div class="card-slots">
                <span class="card-slot">Card Slot 1</span>
                <span class="card-slot">Card Slot 2</span>
                <span class="card-slot">Card Slot 3</span>
                <span class="card-slot">Card Slot 4</span>
                <span class="card-slot">Card Slot 5</span>
            </div>
        </div>
    </div>
    <div class="right-sidebar">
        <h2>Mission Brief</h2>
        <div class="mission-brief"></div>
        <h3>Stacks</h3>
        <div class="action-report"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
